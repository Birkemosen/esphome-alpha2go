esphome:
  name: alpha2go
  friendly_name: "Grundfos Alpha2 Go"
  min_version: 2026.9.0


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    #sdkconfig_options: 
      # Improve WiFi/BLE coexistence on single-radio ESP32-C3
      #CONFIG_ESP_COEX_SW_COEXIST_ENABLE: "y"
      #CONFIG_ESP_WIFI_SW_COEXIST_ENABLE: "y"
      # Disable WPA3 - fixes auth issues with UniFi APs
      #CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "n"
      #CONFIG_ESP_WIFI_ENABLE_SAE_PK: "n"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # WiFi optimization for hardware interference
  power_save_mode: none          # Disable power saving for better stability
  output_power: 8.5              # Reduce TX power (default 20dB) - try 15dB or 12dB if issues persist
  fast_connect: true             # Skip scanning, connect faster (requires static IP)
  # enable_btm: false              # Disable BSS Transition Management
  # enable_rrm: false              # Disable Radio Resource Management

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Alpha2Go_Fallback_Hotspot"
    password: !secret fallback_hotspot_password
  
  #manual_ip: 
  #  static_ip: xxx.xxx.xxx.xxx
  #  gateway: xxx.xxx.xxx.xxx
  #  subnet: 255.255.255.0
    
captive_portal:

# Web interface for local access
web_server:
  port: 80

# Load alpha2 from this GitHub repository (components/alpha2).
external_components:
  - source: github://birkemosen/esphome-alpha2go
    components: [alpha2]

# BLE tracker - tuned for WiFi coexistence on single-radio ESP32-C3
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: false
    interval: 1200ms   # scan every 1.2s (default 320ms) - gives WiFi much more airtime
    window: 30ms       # short scan window to minimize radio contention

# BLE client connection to the pump
ble_client:
  - mac_address: XX:XX:XX:XX:XX:XX  # Replace with your pump's Bluetooth MAC address
    id: heatingpump

# Status LED on GPIO8 - shows WiFi connection state
# Solid = connected, Blinking = connecting/no WiFi
status_led:
  pin:
    number: GPIO8

# Alpha2 sensor platform
sensor:
  - platform: alpha2
    id: pump                     # needed by text_sensor and the alpha2.* actions below
    ble_client_id: heatingpump
    # experimental_class10_write: false   # UNVERIFIED class 10 SET for alpha2.write_object
    flow:
      name: "Pump Flow"
    head:
      name: "Pump Head Pressure"
    speed:
      name: "Pump Speed"
    power:
      name: "Pump Power"
    voltage:
      name: "Pump Voltage"
    current:
      name: "Pump Current"
    # Optional extra sensors
    media_temperature:
      name: "Pump Media Temperature"
    differential_temperature:
      name: "Pump Differential Temperature"
    flow_coefficient_kv:
      name: "Pump Flow Coefficient Kv"
    grid_voltage:
      name: "Pump Grid Voltage"
    dc_link_voltage:
      name: "Pump DC Link Voltage"
    absolute_speed:
      name: "Pump Absolute Speed"
    converter_temperature:
      name: "Pump Converter Temperature"
    inverter_temperature:
      name: "Pump Inverter Temperature"
    setpoint:
      name: "Pump Setpoint"
    setpoint_head:
      name: "Pump Setpoint Head"
    setpoint_speed:
      name: "Pump Setpoint Speed"
    # Stored set point per control mode (ControlModeUserConfiguration)
    const_pressure_setpoint:
      name: "Pump Constant Pressure Setpoint"
    prop_pressure_setpoint:
      name: "Pump Proportional Pressure Setpoint"

# What the pump actually runs (object 86/8, read only)
text_sensor:
  - platform: alpha2
    alpha2_id: pump
    control_mode:
      name: "Pump Control Mode"
    operation_mode:
      name: "Pump Operation Mode"
    control_source:
      name: "Pump Control Source"
    # I / II / III, AUTOADAPT or Advanced. The levels default to the values read
    # from an ALPHA2 GO; check them in the log and override if your pump differs:
    #   const_pressure_levels: [2.5, 5.0, 7.5]   # m
    #   prop_pressure_levels: [4.0, 6.0, 8.0]    # m
    #   const_speed_levels: [5225, 5877, 6350]
    setting:
      name: "Pump Setting"
    # The setting as the pump reports it (86/350), e.g. "Proportional pressure II"
    selected_setting:
      name: "Pump Selected Setting"

# --- Writing to the pump ------------------------------------------------------
# Every write is logged (request bytes and the pump's ACK). Check the log after
# the first write. The pump may only accept a remote set point after "Pump Remote".

# Remote set point in % of the active set point range (class 5 ref_rem).
# alpha2.set_setpoint_rem (class 5 ref_rem) is not in the ALPHA2 GO profiles; the pump
# reports it as 255, so there is no set point slider here.

select:
  - platform: template
    name: "Pump Set Control Mode"
    icon: mdi:tune
    optimistic: true
    options:
      - prop_pressure
      - const_pressure
      - const_speed
      - const_flow
    set_action:
      - alpha2.set_control_mode:
          id: pump
          mode: !lambda 'return x;'

button:
  # Safe test of the write path: sends START, but only if the pump already runs in Auto,
  # and checks that nothing changed. Look for "write test ... PASSED" in the log.
  # (target: ref_rem does not work on the ALPHA2 GO, which has no ref_rem.)
  - platform: template
    name: "Pump Write Test"
    icon: mdi:test-tube
    entity_category: diagnostic
    on_press:
      - alpha2.write_test:
          id: pump
          target: start
  # Same test for the UNVERIFIED class 10 SET path (AutoNight 90/8, written back unchanged).
  # Needs experimental_class10_write: true on the sensor platform.
  # - platform: template
  #   name: "Pump Write Test Class 10"
  #   on_press:
  #     - alpha2.write_test:
  #         id: pump
  #         target: autonight
  # EXPERIMENTAL: select a panel setting by writing predefined_setpoint_setting_obj (86/350),
  # which is what the Grundfos GO app does. The class 10 SET layout is UNVERIFIED.
  # Needs experimental_class10_write: true. data: 0-2 = CC I-III, 3-5 = CP I-III,
  # 6-8 = PP I-III, 10 = CP AUTOADAPT, 11 = PP AUTOADAPT.
  # - platform: template
  #   name: "Pump Setting PP II (experimental)"
  #   on_press:
  #     - alpha2.write_object:
  #         id: pump
  #         object_id: 86
  #         sub_id: 350
  #         type: 868
  #         version: 1
  #         data: [7]
  - platform: template
    name: "Pump Start"
    on_press:
      - alpha2.start: pump
  - platform: template
    name: "Pump Stop"
    on_press:
      - alpha2.stop: pump
  - platform: template
    name: "Pump Min Curve"
    on_press:
      - alpha2.set_min: pump
  - platform: template
    name: "Pump Max Curve"
    on_press:
      - alpha2.set_max: pump
  - platform: template
    name: "Pump Remote"
    on_press:
      - alpha2.remote: pump
  - platform: template
    name: "Pump Local"
    on_press:
      - alpha2.local: pump
